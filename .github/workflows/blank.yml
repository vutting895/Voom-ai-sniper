name: Sniper Analysis Safety CI

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "tests/**"
      - "package.json"
      - "next.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/blank.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sniper-safety-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
