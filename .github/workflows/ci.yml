name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Install API dependencies
        working-directory: apps/api
        run: poetry install
      - name: Lint web and shared packages
        run: pnpm lint
      - name: Lint API
        working-directory: apps/api
        run: poetry run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Install API dependencies
        working-directory: apps/api
        run: poetry install
      - name: Test web and shared packages
        run: pnpm test
      - name: Test API
        working-directory: apps/api
        run: poetry run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build web and shared packages
        run: pnpm build
      - name: Validate Docker Compose config
        run: docker compose config
